<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tickflare tic-tac-toe</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --line: light-dark(#d6d3cb, #45433e);
        --muted: light-dark(#6b6962, #a3a096);
        --accent: light-dark(#b4501e, #f0996f);
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        width: min(22rem, 100vw - 2rem);
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      #status {
        min-height: 1.5em;
        margin: 0 0 1rem;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }
      #board button {
        aspect-ratio: 1;
        font: 600 2.5rem system-ui, sans-serif;
        color: inherit;
        background: none;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        cursor: pointer;
      }
      #board button:disabled {
        cursor: default;
      }
      #board button:not(:disabled):hover {
        border-color: var(--accent);
      }
      #rematch {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      .hint {
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tic-tac-toe</h1>
      <p id="status" role="status">Connecting…</p>
      <div id="board"></div>
      <button id="rematch" hidden>Rematch</button>
      <p class="hint">
        Room <code id="room"></code>. Open this page in a second tab to play against yourself, or
        change the part after # for a new room.
      </p>
    </main>

    <script type="module">
      import { RoomClient } from "./tickflare-client.js";

      const room = /^[A-Za-z0-9_-]{1,64}$/.test(location.hash.slice(1))
        ? location.hash.slice(1)
        : "lobby";
      const player = playerId();

      const statusEl = document.getElementById("status");
      const boardEl = document.getElementById("board");
      const rematchEl = document.getElementById("rematch");
      document.getElementById("room").textContent = room;

      const cells = Array.from({ length: 9 }, (_, cell) => {
        const button = document.createElement("button");
        button.setAttribute("aria-label", `Cell ${cell + 1}`);
        button.addEventListener("click", () => send({ type: "place", cell }));
        boardEl.append(button);
        return button;
      });
      rematchEl.addEventListener("click", () => send({ type: "rematch" }));
      // A different room is a different connection: start over.
      addEventListener("hashchange", () => location.reload());

      let closedBecause = "";
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      const client = new RoomClient(`${scheme}://${location.host}/rooms/${room}?player=${player}`, {
        onState: render,
        onPresence: render,
        onStatus(status, detail) {
          if (status === "closed") {
            closedBecause =
              detail?.code === 4001
                ? "This room is full."
                : detail?.code === 4000
                  ? "You opened this game somewhere else."
                  : "Disconnected.";
          }
          render();
        },
      });

      function send(command) {
        // The server is the judge: a refused move just leaves the board as it is.
        client.send(command).catch((error) => console.info(error.message));
      }

      function render() {
        const state = client.state;
        const mine = state?.marks[client.you];
        const myTurn = client.status === "open" && state && !state.winner && state.turn === mine;
        const seated = state ? Object.keys(state.marks).length : 0;

        cells.forEach((button, cell) => {
          const mark = state?.board[cell] ?? "";
          button.textContent = mark;
          button.disabled = !myTurn || seated < 2 || mark !== "";
        });
        rematchEl.hidden = !(client.status === "open" && state?.winner);

        if (client.status === "closed") statusEl.textContent = closedBecause;
        else if (client.status === "connecting" || !state) statusEl.textContent = "Connecting…";
        else if (seated < 2) statusEl.textContent = `You are ${mine}. Waiting for an opponent…`;
        else if (state.winner === "draw") statusEl.textContent = "Draw.";
        else if (state.winner) statusEl.textContent = state.winner === mine ? "You won." : "You lost.";
        else if (client.players.some((p) => !p.connected)) statusEl.textContent = "Opponent disconnected. Waiting…";
        else statusEl.textContent = myTurn ? `Your turn (${mine}).` : "Opponent's turn.";
      }

      function playerId() {
        // Per tab, so two tabs are two players. Survives a reload, which is how you see resume work.
        try {
          const saved = sessionStorage.getItem("tickflare-player");
          if (saved) return saved;
          const fresh = crypto.randomUUID();
          sessionStorage.setItem("tickflare-player", fresh);
          return fresh;
        } catch {
          return crypto.randomUUID();
        }
      }
    </script>
  </body>
</html>
