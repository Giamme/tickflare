name: Release

# Releases on every push to main that brings a user-visible change. Changelogger
# (.changelog/changelogger.py) picks the version from the fragments in .changelog/unreleased/
# (before 1.0: a breaking change or a new feature makes 0.x+1, anything else a patch), bumps
# package.json and the Unity package together, and compiles CHANGELOG.md. The package is then
# tested, the release commit "chore(release): v<version>" and its tag are pushed, the package is
# published to npm with provenance, and the version gets a GitHub release with its notes. A push
# with nothing user-visible releases nothing.
#
# A tag pushed by hand (a pre-release or a hotfix made locally with changelogger) is published the
# same way. The tags this workflow pushes do not start it again: GitHub runs no workflows for what
# its own token pushes. For the same reason it starts the docs deploy itself.
#
# npm accepts the publish through trusted publishing, set up on npmjs.com for this repository and
# this file, or the repository secret NPM_TOKEN.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # the release commit, its tag and the GitHub release
  id-token: write # provenance, and trusted publishing
  actions: write # starting the docs deploy for the release commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The release commit lands on main too: never release it again.
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The branch head, not the pushed commit: a queued run starts after the last release.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Cut a release if anything is unreleased
        id: cut
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          before=$(node -p "require('./package.json').version")
          # Refuses, writing nothing, while a commit lacks a fragment or a fragment is a draft.
          python3 .changelog/changelogger.py release auto
          after=$(node -p "require('./package.json').version")
          if [ "$before" = "$after" ]; then
            echo "Nothing user-visible to release."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git add -A .changelog CHANGELOG.md package.json package-lock.json clients/unity/package.json
          git commit -m "chore(release): v$after"
          git tag -a "v$after" -m "Tickflare $after"
          echo "version=$after" >> "$GITHUB_OUTPUT"

      - name: The version to publish
        id: version
        env:
          CUT: ${{ steps.cut.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$(node -p "require('./package.json').version")" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME but package.json says otherwise."
              exit 1
            fi
            if ! grep -q "^## $version\$" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $version."
              exit 1
            fi
          else
            version=$CUT
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.version != ''
        run: npm ci
      - if: steps.version.outputs.version != ''
        run: npm run typecheck
      - if: steps.version.outputs.version != ''
        run: npm test

      - name: Push the release commit and its tag
        if: steps.version.outputs.version != '' && github.ref_type == 'branch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # If main moved on meanwhile, this fails and publishes nothing; the next run releases it all.
        run: git push --atomic origin HEAD:main "v$VERSION"

      - name: Publish to npm
        if: steps.version.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "tickflare@$VERSION" version > /dev/null 2>&1; then
            echo "tickflare@$VERSION is on npm already."
            exit 0
          fi
          # npm 11.5 and later publish through trusted publishing when it is set up.
          npm install -g npm@latest
          npm publish

      - name: Release on GitHub
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .changelog/changelogger.py notes "$VERSION" > notes.md
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
          fi

      - name: Deploy the docs, whose changelog page has the new version
        if: steps.version.outputs.version != '' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
