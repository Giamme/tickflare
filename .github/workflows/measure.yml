name: Measure on Cloudflare

# Deploys the benchmark Worker in `bench/` to Cloudflare, puts load on it from this runner, asks
# Cloudflare what it counted, and deletes the Worker again. Started by hand: it runs on the
# account the repository's secrets belong to, for up to half an hour.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "measure: all of it. analytics: only ask what Cloudflare counted for an earlier run. report: tools/rooms-report.mjs on the namespaces of an earlier run. describe: what its analytics can be asked. delete: remove a Worker that was kept."
        required: false
        default: "measure"
      scenarios:
        description: "measure: which of idle, latency, wire, rates, or soak (alone, the better part of an hour). Empty runs all but soak."
        required: false
        default: ""
      analytics_wait:
        description: "measure: the longest to wait for Cloudflare's analytics, which lag by some minutes, in seconds."
        required: false
        default: "900"
      table:
        description: "rates: the rooms to measure, as JSON, in place of the usual list. [{\"units\":1000,\"sight\":100,\"players\":1000,\"rate\":10}]. A row may add \"moving\":0.1 (the share of units that move), \"versioned\":true (views with versions), \"compression\":\"fast\", \"binary\":true, \"deflate\":false, or \"profile\":\"cpu\" (or \"heap\") for a profile of its room from Cloudflare."
        required: false
        default: ""
      silent_ms:
        description: "measure: silentAfterMs for the rooms, if not Tickflare's default. 0 never closes a silent connection."
        required: false
        default: ""
      soak_minutes:
        description: "soak: for how long rooms are played and left."
        required: false
        default: "40"
      keep:
        description: "measure: 'yes' leaves the Worker deployed, to ask its analytics later. Delete it with mode delete."
        required: false
        default: ""
      worker:
        description: "delete: the Worker's name, as the run that kept it printed it."
        required: false
        default: ""
      namespaces:
        description: "analytics and report: the namespaces, as the run printed them."
        required: false
        default: "[]"
      since:
        description: "analytics and report: from when, as 2026-01-31T12:00:00Z."
        required: false
        default: ""

permissions:
  contents: read

# Each run deploys a Worker of its own, so runs with different settings can go side by side.
concurrency:
  group: measure-${{ inputs.mode }}-${{ inputs.scenarios }}-${{ inputs.silent_ms }}-${{ inputs.table != '' }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      WORKER: tickflare-bench-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Keep the account's address and name out of the log
        run: bash scripts/mask-cloudflare-account.sh

      - name: Find the account's workers.dev address, and make a key for this run
        if: inputs.mode == 'measure'
        run: |
          set -euo pipefail
          # Neither is to be read in the log: the address names the account, the key opens the Worker.
          SUBDOMAIN=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$SUBDOMAIN" ] || [ "$SUBDOMAIN" = "null" ]; then echo "This account has no workers.dev address."; exit 1; fi
          echo "::add-mask::$SUBDOMAIN"
          KEY=$(openssl rand -hex 24)
          echo "::add-mask::$KEY"
          echo "BENCH_KEY=$KEY" >> "$GITHUB_ENV"
          echo "BENCH_HOST=$WORKER.$SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"

      - name: Deploy the benchmark Worker
        if: inputs.mode == 'measure'
        env:
          SILENT_MS: ${{ inputs.silent_ms }}
        run: |
          set -euo pipefail
          # Cloudflare's API sometimes does not know a Worker yet in the moment after it was uploaded.
          for attempt in 1 2 3; do
            SILENT=()
            if [ -n "$SILENT_MS" ]; then SILENT=(--var "BENCH_SILENT_MS:$SILENT_MS"); fi
            if npx wrangler deploy --config bench/wrangler.jsonc --name "$WORKER" --var "BENCH_KEY:$BENCH_KEY" "${SILENT[@]}" > deploy.log 2>&1; then break; fi
            sed "s/$BENCH_KEY/[key]/g" deploy.log | tail -12
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          grep -i "uploaded\|deployed" deploy.log | sed "s/$BENCH_KEY/[key]/g" || true
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://$BENCH_HOST/health?key=$BENCH_KEY")" = "200" ]; then echo "The Worker answers."; exit 0; fi
            sleep 2
          done
          echo "The Worker did not answer within two minutes."
          exit 1

      - name: Which Durable Object namespace is which
        if: inputs.mode == 'measure'
        run: |
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/durable_objects/namespaces?per_page=100" \
            | jq -c --arg script "$WORKER" '[.result[] | select(.script == $script) | {id, class}]' | tee namespaces.json

      - name: Measure
        if: inputs.mode == 'measure'
        env:
          BENCH_URL: wss://${{ env.BENCH_HOST }}
          SCENARIOS: ${{ inputs.scenarios }}
          BENCH_SOAK_MINUTES: ${{ inputs.soak_minutes }}
          BENCH_TABLE: ${{ inputs.table }}
        run: |
          set -o pipefail
          echo "SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          node bench/load.mjs $SCENARIOS 2>&1 | tee results.log

      - name: Where the profiled rooms spent their time
        if: always() && inputs.mode == 'measure' && hashFiles('profiles/*') != ''
        run: for file in profiles/*; do node bench/pprof-top.mjs "$file" 30; echo; done

      - name: Keep the profiles
        if: always() && inputs.mode == 'measure' && hashFiles('profiles/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: profiles/
          retention-days: 14

      - name: What Cloudflare counted
        if: inputs.mode == 'measure' && inputs.scenarios != 'soak'
        continue-on-error: true
        env:
          WAIT_SECONDS: ${{ inputs.analytics_wait }}
        run: node bench/analytics.mjs

      - name: What Cloudflare billed each room for, against the time it had players
        if: inputs.mode == 'measure' && inputs.scenarios == 'soak'
        continue-on-error: true
        env:
          BENCH_URL: wss://${{ env.BENCH_HOST }}
          WAIT_SECONDS: ${{ inputs.analytics_wait }}
        run: node bench/soak-report.mjs

      - name: What Cloudflare counted, for an earlier run
        if: inputs.mode == 'analytics'
        env:
          NAMESPACES: ${{ inputs.namespaces }}
          SINCE: ${{ inputs.since }}
        run: node bench/analytics.mjs

      - name: Which rooms an earlier run was billed for
        if: inputs.mode == 'report'
        env:
          NAMESPACES: ${{ inputs.namespaces }}
          SINCE: ${{ inputs.since }}
        run: |
          ARGS=()
          for id in $(echo "$NAMESPACES" | jq -r '.[].id'); do ARGS+=(--namespace "$id"); done
          node tools/rooms-report.mjs "${ARGS[@]}" --since "$SINCE"

      - name: What Cloudflare's analytics can be asked
        if: inputs.mode == 'describe'
        run: node bench/analytics.mjs --describe

      - name: The rooms report, on this run's Worker
        if: inputs.mode == 'measure'
        continue-on-error: true
        run: node tools/rooms-report.mjs --worker "$WORKER" --since "$SINCE" --top 12

      - name: Delete the benchmark Worker
        if: always() && inputs.mode == 'measure' && inputs.keep != 'yes'
        run: npx wrangler delete --config bench/wrangler.jsonc --name "$WORKER" --force > delete.log 2>&1 && echo "Deleted $WORKER." || { cat delete.log; exit 1; }

      - name: The benchmark Worker was kept
        if: always() && inputs.mode == 'measure' && inputs.keep == 'yes'
        run: echo "Kept $WORKER. Delete it with mode delete."

      - name: Delete a Worker that was kept
        if: inputs.mode == 'delete'
        env:
          KEPT: ${{ inputs.worker }}
        run: |
          case "$KEPT" in
            tickflare-bench-*) npx wrangler delete --config bench/wrangler.jsonc --name "$KEPT" --force > delete.log 2>&1 && echo "Deleted $KEPT." || { cat delete.log; exit 1; } ;;
            *) echo "Only a tickflare-bench Worker is deleted here."; exit 1 ;;
          esac
