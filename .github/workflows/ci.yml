name: CI

# Every pull request and every push to main. A pull request that only changes documentation
# (DOCS_ONLY below) runs no tests: the Docs workflow builds the site, and the Changelog workflow
# checks the fragments. The "CI passed" job at the end is the one check main requires: it fails
# when any job did, and passes for a documentation-only change. The release pull request gets
# that check from the Release workflow, which tested the commit before pushing it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on a pull request makes its running check obsolete. On main every run is the
# record for its commit, so none is cancelled there.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Pick the jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.pick.outputs.run }}
    steps:
      # A pull request is checked out as its merge into the base branch: with the merge's parents
      # fetched, HEAD^1..HEAD is exactly what the pull request changes.
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import fnmatch, os, subprocess, sys
          # Files no test, build or client reads. fnmatch's * also matches /, so docs/* is the
          # whole folder and *.md is every Markdown file in the repository.
          DOCS_ONLY = ['docs/*', '*.md', '.changelog/unreleased/*', 'LICENSE',
                       '.github/ISSUE_TEMPLATE/*', '.github/pull_request_template.md']
          run = True
          if os.environ['EVENT'] == 'pull_request':
              changed = subprocess.run(['git', 'diff', '--name-only', '-z', 'HEAD^1', 'HEAD'], check=True,
                                       capture_output=True, text=True).stdout.split('\0')
              changed = [path for path in changed if path]
              print('changed files:', *changed, sep='\n  ', file=sys.stderr)
              run = not all(any(fnmatch.fnmatchcase(path, glob) for glob in DOCS_ONLY) for path in changed)
          print('run=' + ('true' if run else 'false'))
          PY

  test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runs inside workerd, with local D1, R2 and Queues.
      - run: npm test
      - run: npm run build

  # The Godot client, run in Godot against a local Worker.
  godot-client:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.5.1-stable
      GODOT_SHA256: 02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            echo "${GODOT_SHA256}  /tmp/godot.zip" | sha256sum -c -
            unzip -q /tmp/godot.zip -d /tmp/godot
            mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot/godot
          fi
      - name: Start the test server
        run: |
          npx wrangler dev --config clients/test-server/wrangler.jsonc --port 8787 > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8787/ && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Test the client
        env:
          TICKFLARE_TEST_URL: ws://127.0.0.1:8787
        run: |
          set -o pipefail
          timeout 300 ~/godot/godot --headless --path clients/godot --script res://tests/run.gd 2>&1 | tee godot.log
          # A script that does not load, or stops halfway, is a failure too.
          grep -q " checks, 0 failed" godot.log
          if grep -q "SCRIPT ERROR\|Parse Error" godot.log; then exit 1; fi
      - if: failure()
        run: cat server.log

  # The Unity client, compiled as Unity compiles it and run on .NET against a local Worker.
  unity-client:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the client and its tests
        run: dotnet build clients/unity/Tests~/Tests -c Release
      - name: Start the test server
        run: |
          npx wrangler dev --config clients/test-server/wrangler.jsonc --port 8787 > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8787/ && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Test the client
        env:
          TICKFLARE_TEST_URL: ws://127.0.0.1:8787
        run: |
          set -o pipefail
          timeout 300 dotnet run --project clients/unity/Tests~/Tests -c Release --no-build 2>&1 | tee unity.log
          grep -q " checks, 0 failed" unity.log
      - name: Compile the client as for a WebGL build
        # Only compiled: the browser socket needs a browser and Unity's WebGL player to run.
        run: dotnet build clients/unity/Tests~/Library -c Release -p:DefineConstants=UNITY_WEBGL
      - if: failure()
        run: cat server.log

  passed:
    name: CI passed
    if: always()
    needs: [plan, test, godot-client, unity-client]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PLAN: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          TEST: ${{ needs.test.result }}
          GODOT: ${{ needs.godot-client.result }}
          UNITY: ${{ needs.unity-client.result }}
        run: |
          echo "plan: $PLAN, tests needed: $RUN, test: $TEST, godot-client: $GODOT, unity-client: $UNITY"
          [ "$PLAN" = success ] || exit 1
          if [ "$RUN" = false ]; then echo "Documentation only: no tests to run."; exit 0; fi
          [ "$TEST" = success ] && [ "$GODOT" = success ] && [ "$UNITY" = success ]
