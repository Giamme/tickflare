name: Docs

# Builds the documentation site from docs/ and the doc comments in src/, and
# deploys it to Cloudflare as the Worker `tickflare-docs`. Pull requests only
# build it, so a dead link or an undocumented export fails before it lands.
# Deploying needs the same two repository secrets as the examples:
#   CLOUDFLARE_API_TOKEN   made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account to deploy to
# and, to serve it from a domain on that account instead of workers.dev, the
# repository variable SITE_DOMAIN: with gridpaper.dev, the site is at
# tickflare.gridpaper.dev.
on:
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "CHANGELOG.md", ".github/workflows/docs.yml", "scripts/*.sh"]
  pull_request:
    paths: ["docs/**", "src/**", "CHANGELOG.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
        with:
          # VitePress dates each page from its last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      # Fails on any export without a doc comment, and on dead links.
      - run: npm run build
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # This repository's own site is on gridpaper.dev; a fork's goes to workers.dev unless it sets the variable.
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || (github.repository == 'Giamme/tickflare' && 'gridpaper.dev' || '') }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy the docs."
            exit 0
          fi
          bash ../scripts/mask-cloudflare-account.sh
          if [ -n "$SITE_DOMAIN" ]; then
            npx wrangler deploy --domain "tickflare.$SITE_DOMAIN" 2>&1 | tee deploy.log
            bash ../scripts/workers-dev-off.sh tickflare-docs
            url="https://tickflare.$SITE_DOMAIN"
          else
            npx wrangler deploy 2>&1 | tee deploy.log
            url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          fi
          if [ -n "$url" ]; then
            echo "Docs deployed to $url" >> "$GITHUB_STEP_SUMMARY"
            # A first deploy can take a few minutes to answer, a new domain's certificate longest.
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url/guide/getting-started"; then exit 0; fi
              sleep 10
            done
            echo "::error::$url/guide/getting-started does not answer."
            exit 1
          fi
