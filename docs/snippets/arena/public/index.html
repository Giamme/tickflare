<!doctype html>
<meta charset="utf-8" />
<title>Arena</title>
<canvas id="arena" width="600" height="600" style="max-width: 100%; border-radius: 14px"></canvas>
<script type="module">
  import { AccountClient, Interpolator, RoomClient } from "./tickflare-client.js";

  const canvas = document.querySelector("#arena");
  const ctx = canvas.getContext("2d");
  const k = canvas.width / 100;

  const accounts = new AccountClient(); // a guest until they sign up
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const room = new RoomClient(`${scheme}://${location.host}/rooms/arena`, { token: accounts.tokenSource });

  // Patches arrive ten times a second; the screen draws sixty. Glide between them.
  const glide = new Interpolator(100, ["x", "y"]);
  const dots = (view) => (view.me ? { ...view.others, [room.you]: view.me } : {});
  room.on("state", (view) => glide.update(dots(view)));

  canvas.addEventListener("click", (event) => {
    const box = canvas.getBoundingClientRect();
    const x = ((event.clientX - box.left) / box.width) * 100;
    const y = ((event.clientY - box.top) / box.height) * 100;
    room.send({ type: "move", x, y }).catch(() => {});
  });

  function disc(at, radius, colour) {
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.arc(at.x * k, at.y * k, radius * k, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    const view = room.state;
    ctx.fillStyle = "#0b101c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (view?.me) {
      disc(glide.at(room.you) ?? view.me, 30, "#18213a"); // what this player can see
      for (const pellet of Object.values(view.pellets)) disc(pellet, 1.3, "#eef1f8");
      for (const id of Object.keys(dots(view))) {
        disc(glide.at(id) ?? dots(view)[id], 3.4, id === room.you ? "#ff4f36" : "#3d8bff");
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
